name: Lint

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4
      # Keep the ruff version in sync with .pre-commit-config.yaml
      - name: Lint code
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.7"
          args: "check --output-format=github"
      - name: Check code format
        run: |
          ruff format --check --diff
