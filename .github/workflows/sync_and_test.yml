name: Sync with uv and test

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
      python-version:
        required: true
        type: string
      os:
        required: true
        type: string
      experimental_or_skip_heavy_tests:
        required: true
        type: boolean

jobs:
  sync_and_test:
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      # Sync pipeline
      - name: Install the project
        run: |
          uv sync --extra pyg

      # Testing pipeline
      - name: Full Test
        if: ${{ inputs.experimental_or_skip_heavy_tests == false && inputs.os == 'ubuntu-latest' }}
        run: |
          uv run -m pytest -v -n auto --cov=hopwise --cov-report= tests
      - name: Build coverage report and badge
        if: ${{ !cancelled() && inputs.experimental_or_skip_heavy_tests == false && inputs.os == 'ubuntu-latest' }}
        run: |
          uv run coverage html -d coverage-report
          # coverage.py writes a catch-all .gitignore that would prevent committing the report
          rm -f coverage-report/.gitignore
          total=$(uv run coverage report --format=total)
          if   [ "$total" -ge 90 ]; then color=brightgreen
          elif [ "$total" -ge 75 ]; then color=green
          elif [ "$total" -ge 60 ]; then color=yellow
          elif [ "$total" -ge 40 ]; then color=orange
          else color=red
          fi
          printf '{"schemaVersion": 1, "label": "coverage", "message": "%s%%", "color": "%s"}\n' \
            "$total" "$color" > coverage-report/badge.json
          {
            echo "## Coverage: ${total}%"
            echo
            uv run coverage report --format=markdown --skip-covered
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() && inputs.experimental_or_skip_heavy_tests == false && inputs.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          include-hidden-files: true
      - name: Test Config
        if: ${{ inputs.experimental_or_skip_heavy_tests != false || inputs.os != 'ubuntu-latest' }}
        run: |
          uv run -m pytest -v -n auto tests/config/test_config.py
      - name: Test metrics
        if: ${{ inputs.experimental_or_skip_heavy_tests != false || inputs.os != 'ubuntu-latest' }}
        run: |
          uv run -m pytest -v -n auto tests/metrics
      - name: Test data
        if: ${{ inputs.experimental_or_skip_heavy_tests != false || inputs.os != 'ubuntu-latest' }}
        run: |
          uv run -m pytest -v -n auto tests/data
      - name: Test evaluation_setting
        if: ${{ inputs.experimental_or_skip_heavy_tests != false || inputs.os != 'ubuntu-latest' }}
        run: |
          uv run -m pytest -v -n auto tests/evaluation_setting
      - name: Test hyper_tuning
        if: ${{ inputs.experimental_or_skip_heavy_tests != false || inputs.os != 'ubuntu-latest' }}
        run: |
          uv run -m pytest -v tests/hyper_tuning/test_hyper_tuning.py
